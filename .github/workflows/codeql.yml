name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 8 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          # Private archives may not have a paid code-scanning entitlement.
          # Always evaluate the SARIF locally, even when upload is unavailable.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Reject security findings
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('../results/javascript.sarif', 'utf8'));
          const findings = report.runs.flatMap(run => run.results ?? []);
          for (const finding of findings) console.error(finding.ruleId, finding.message.text);
          if (findings.length) process.exit(1);
          console.log('CodeQL: no findings.');
          JS
